<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang Chủ</title>
  <!-- <link rel="stylesheet" href="./assets/css/style.css"> -->
</head>
<style>
@import url('https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100..900&display=swap');

* {
  box-sizing: border-box;
  font-family: "Lexend Deca", sans-serif;
}

body {
  margin: 0;
  position: relative;
}

a {
  text-decoration: none;
}

img {
  display: block;
}


li {
  list-style: none;  
}

:root {
  --color-background: #7FBBE4;
  --color-text: black;
}

.page-account {
  background-color: var(--color-background);
  min-height: 100vh;
  padding: 40px 0;  
}

.page-account .inner-top {
  margin: 0 0 30px 60px;
  display: flex;
  align-items: center;
  gap: 30px;
}

.page-account .inner-top .inner-logo a img {
  width: auto;
  height: 120px;
}

.page-account .inner-top .inner-title {
  line-height: 1.4;
  margin: 0;
  font-size: 25px;
  font-weight: 700;
  color: #fff;
}

.page-account .inner-top .inner-title span {
  font-weight: 500;
}


.page-account .inner-middle {
  width: 630px;
  margin-left: auto;
  margin-right: auto;
  margin-bottom: 35px; 
  background-color: #fff;
  border-radius: 24px;
  padding: 28px 25px;
}

.page-account .inner-middle .inner-title {
  margin-top: 0;
  margin-bottom: 30px;
  text-align: center;
  font-size: 32px;
  font-weight: 700;
  color: var(--color-text);
}

.page-account .inner-form .inner-group {
  margin-bottom: 20px;
}

.page-account .inner-form .inner-label {
  display: block;
  margin-bottom: 10px;
  font-size: 18px;
  font-weight: 600;
  opacity: 0.8;
}

.page-account .inner-group .inner-input {
  background-color: #F1F4F9;
  border-radius: 8px;
  width: 100%;
  height: 45px;
  border: 1px solid #D8D8D8;
  padding: 0 16px; 
  outline: none;
}

.page-account .inner-group .inner-input::placeholder {
  font-size: 15px;
  font-weight: 600;
  color: #A6A6A6;
}

.page-account .inner-form .inner-button {
  width: 100%;
  padding: 15px;
  border-radius: 8px;
  background-color: #3898d9;
  border: none;
  margin-top: 18px;
  font-size: 20px;
  font-weight: 700;
  color: #fff;
}

.page-account .inner-form .inner-button:hover {
  background-color: #5d96bb;
}

.page-account .inner-bottom {
  text-align: center;
}

.page-account .inner-bottom .inner-copyright {
  font-size: 15px;  
  font-weight: 700;
  color: #fff;
}

</style>
<body>
  <div class="page-account">
    <div class="inner-top">
      <div class="inner-logo">
        <a href="#">
          <img src="./assets/image/logo.png" alt="logo">
        </a>
      </div>
      <h1 class="inner-title">
        ĐẠI HỌC HUẾ<br>
        <span>TRƯỜNG ĐẠI HỌC KHOA HỌC</span> 
      </h1>
    </div>
    <div class="inner-middle">
      <h2 class="inner-title">
        USER
      </h2>
      <form action="" class="inner-form">
        <div class="inner-group">
          <label for="email" class="inner-label">Email</label>
          <input class="inner-input" type="email" name="" id="email" placeholder="Ví dụ: 20T1080099@gmail.com">
        </div>
        <div class="inner-group">
          <label for="password" class="inner-label">Password</label>
          <input class="inner-input" type="password" name="" id="password" placeholder="......">
        </div>
        <button class="inner-button">Đăng Nhập</button>
      </form>
    </div>
    <div class="inner-bottom">
      <div class="inner-copyright">
        @Copy-right HUSC
      </div>
    </div>
  </div>
</body>
</html>
