<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang Thông Tin Lớp Học</title>
  <!-- <link rel="stylesheet" href="./assets/css/style.css"> -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100..900&display=swap');

* {
  box-sizing: border-box;
  font-family: "Lexend Deca", sans-serif;
}

body {
  margin: 0;
  position: relative;
}

a {
  text-decoration: none;
}

img {
  display: block;
}


li {
  list-style: none;  
}

:root {
  --color-background: #7FBBE4;
  --color-text: black;
}

.side {
  background-color: #7FBBE4;
  width: 240px;
  min-height: 100vh;
  padding: 35px 0;
  position: fixed;
  top: 0;
  left: 0;
  z-index: 9999;
}

.side .inner-user {
  display: flex;
  flex-direction: column;
  align-items: center; 
  gap: 12px; 
  margin-bottom: 60px;
}

.side .inner-image {
  width: 140px;
  height: 140px;
  border-radius: 50%;
  background-color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.side .inner-image a img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
}

.side .inner-user .inner-name {
  margin: 0;
  text-align: center;
  font-size: 20px;
  font-weight: 700;
  color: #fff;
}

.side .inner-menu {
  background-color: #fff;
}

.side .inner-menu ul {
  padding-left: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.side .inner-menu ul li {
  width: 100%;
  text-align: center;
  border: 1px solid #accde3;
  padding: 15px 0;
}

.side .inner-menu ul li a {
  font-size: 16px;
  font-weight: 700;
  color: #3898d9;
}

.side .inner-menu ul li:hover,
.side .inner-menu ul .active{
  background-color: #80C1EE;
  color: #fff;
}

.side .inner-menu ul .active a {
 color: #fff;
}

.side .inner-menu ul li:hover a {
  color: #fff;
}

.main {
  position: absolute;
  left: 240px;
  top: 0;
  width: calc(100% - 240px);
  min-height: 100vh;
  background-color: #F5F6FA;
}

.main .main-top {
  height: 120px;
  padding: 10px 40px 20px 40px;
  position: sticky;
  top: 0;
  left: 0;
  z-index: 9999;
  /* border-bottom: 1px solid var(--color-background); */
  /* background-color: ; */
}

.main .main-top .inner-list-icon ul {
  margin: 0;
  padding: 0;
  display: flex;
  gap: 25px;
  align-items: center;
  position: absolute;
  top: 20;
  right: 70;
}

.main .main-top .inner-list-icon ul li a {
  font-size: 30px;
  font-weight: 900;
  color: var(--color-text);
}

.main .main-top .inner-list-icon ul li a:hover{
  color: #3898d9;
}

.main .main-top .inner-title {
  color: #3898d9;
  text-align: center;
  font-size: 40px;
}

.main .main-middle {
  overflow-y: auto;
  max-height: calc(100vh - 120px);
  padding: 70px 80px 50px 80px;
}

.main .main-middle .inner-list {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 50px 20px;
}

.section-3 {
  padding: 50px 60px;
  background-color: #fff;
  border-radius: 24px;
}

.section-3 .inner-title {
  margin: 0;
  font-size: 35px;
  font-family: 900;
  color: #0056b3;
  margin-bottom: 50px;
}

.section-3 .inner-title span {
  font-size: 25px;
  font-weight: 500;
  color: #3898d9;
}

.section-3 .inner-form {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 20px;
  margin-bottom: 40px;
}

.section-3 .inner-form .inner-input {
  width: 300px;
  height: 30px;
  border-radius: 5px;
  outline: none;
  padding: 10px;
  border: 2px solid var(--color-background);
  /* background-color: var(--color-background); */
}

.section-3 .inner-form .inner-input::placeholder {
  font-size: 15px;
  font-weight: 600;
  /* color: var(--color-text); */
}

.section-3 .inner-form .inner-button {
  font-size: 20px;
  background-color: transparent;
  border: none;
}

.section-3 .inner-form .inner-button i {
  color: #0056b3;
}

.section-3 .inner-list-info {
  display: flex;
  flex-direction: column;
  gap: 50px;
}

.section-3 .inner-info .inner-head {
  border-bottom: 2px solid #3898d9;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 10px;
  margin-bottom: 30px;
}

.section-3 .inner-info .inner-human-resource {
  margin: 0;
  font-size: 25px;
  font-weight: 700;
  color: #0056b3;
}

.section-3 .inner-head .inner-count {
  font-size: 18px;
  font-weight: 500;
  color: #0056b3;
}

.section-3 .inner-list-inde{
  display: flex;
  flex-direction: column;
  gap: 60px;
}

.box-group {
  display: flex;
  align-items: center;
  gap: 30px;
}

.box-group .inner-image {
  width: 80px;
  height: 80px;
  background-color: #fff;
  overflow: hidden;
  border-radius: 50%;
  border: 1px solid var(--color-background);
}

.box-group .inner-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.box-group .inner-name {
  font-size: 20px;
  font-weight: 500;
  color: #3898d9;
}
</style>
<body>
  <nav class="side">
    <div class="inner-user">
      <div class="inner-image">
        <a href="#">
          <img src="./assets/image/myself.png" alt="">
        </a>
      </div>
      <h2 class="inner-name">
        Admin
     </h2>
    </div>
    <div class="inner-menu">
      <ul>
        <li class="active">
          <a href="#">
            Trang Chủ
          </a>
        </li>
        <li>
          <a href="#">
            Thêm Dữ Liệu
          </a>
        </li>
        <li>
          <a href="#">
            Đăng Xuất
          </a>
        </li>
      </ul>
    </div>
  </nav>
  <div class="main">
    <div class="main-top">
      <div class="inner-list-icon">
        <ul>
          <li><a href="#"><i class="fa-solid fa-bell"></i></a></li>
          <li><a href="#"><i class="fa-solid fa-right-from-bracket"></i></a></li>
        </ul>
      </div>
      <h1 class="inner-title">
        Thông Tin Lớp Học
      </h1>
    </div>
    <div class="main-middle">
      <div class="section-3">
        <h2 class="inner-title">Lớp Tán Gái Nam Mỹ - <span>2024-2025.2.TIN4013.002</span></h2>

        <form action="" method="" class="inner-form">
          <input type="text" name="" id="" class="inner-input" placeholder="Tìm kiếm">
          <button class="inner-button">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
        </form>

        <div class="inner-list-info">
          <div class="inner-info">
            <div class="inner-head">
              <h3 class="inner-human-resource">
                Giảng Viên
              </h3>
            </div>
            <div class="box-group">
              <div class="inner-image">
                <img src="./assets/image/myself-hs.png" alt="">
              </div>
              <div class="inner-name">Nguyễn Xuân Huy</div>
            </div>
          </div>
          <div class="inner-info">
            <div class="inner-head">
              <h3 class="inner-human-resource">
                Sinh Viên
              </h3>
              <div class="inner-count">50 Sinh Viên</div>
            </div>
            <div class="inner-list-inde">
              <div class="box-group">
                <div class="inner-image">
                  <img src="./assets/image/myself.png" alt="">
                </div>
                <div class="inner-name">Huy Xuân Nguyễn</div>
              </div>
              <div class="box-group">
                <div class="inner-image">
                  <img src="./assets/image/myself.png" alt="">
                </div>
                <div class="inner-name">Huy Xuân Nguyễn</div>
              </div>
              <div class="box-group">
                <div class="inner-image">
                  <img src="./assets/image/myself.png" alt="">
                </div>
                <div class="inner-name">Huy Xuân Nguyễn</div>
              </div>
              <div class="box-group">
                <div class="inner-image">
                  <img src="./assets/image/myself.png" alt="">
                </div>
                <div class="inner-name">Huy Xuân Nguyễn</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    </div>
  </div>
</body>
</html>
