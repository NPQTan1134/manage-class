<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang Tạo Lớp</title>
  <!-- <link rel="stylesheet" href="./assets/css/style.css"> -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100..900&display=swap');

* {
  box-sizing: border-box;
  font-family: "Lexend Deca", sans-serif;
}

body {
  margin: 0;
  position: relative;
}

a {
  text-decoration: none;
}

img {
  display: block;
}


li {
  list-style: none;  
}

:root {
  --color-background: #7FBBE4;
  --color-text: black;
}

.side {
  background-color: #7FBBE4;
  width: 240px;
  min-height: 100vh;
  padding: 35px 0;
  position: fixed;
  top: 0;
  left: 0;
  z-index: 9999;
}

.side .inner-user {
  display: flex;
  flex-direction: column;
  align-items: center; 
  gap: 12px; 
  margin-bottom: 60px;
}

.side .inner-image {
  width: 140px;
  height: 140px;
  border-radius: 50%;
  background-color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.side .inner-image a img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
}

.side .inner-user .inner-name {
  margin: 0;
  text-align: center;
  font-size: 20px;
  font-weight: 700;
  color: #fff;
}

.side .inner-menu {
  background-color: #fff;
}

.side .inner-menu ul {
  padding-left: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.side .inner-menu ul li {
  width: 100%;
  text-align: center;
  border: 1px solid #accde3;
  padding: 15px 0;
}

.side .inner-menu ul li a {
  font-size: 16px;
  font-weight: 700;
  color: #3898d9;
}

.side .inner-menu ul li:hover,
.side .inner-menu ul .active{
  background-color: #80C1EE;
  color: #fff;
}

.side .inner-menu ul .active a {
 color: #fff;
}

.side .inner-menu ul li:hover a {
  color: #fff;
}

.main {
  position: absolute;
  left: 240px;
  top: 0;
  width: calc(100% - 240px);
  min-height: 100vh;
  background-color: #F5F6FA;
}

.main .main-top {
  height: 120px;
  padding: 10px 40px 20px 40px;
  position: sticky;
  top: 0;
  left: 0;
  z-index: 9999;
  /* border-bottom: 1px solid var(--color-background); */
  /* background-color: ; */
}

.main .main-top .inner-list-icon ul {
  margin: 0;
  padding: 0;
  display: flex;
  gap: 25px;
  align-items: center;
  position: absolute;
  top: 20;
  right: 70;
}

.main .main-top .inner-list-icon ul li a {
  font-size: 30px;
  font-weight: 900;
  color: var(--color-text);
}

.main .main-top .inner-list-icon ul li a:hover{
  color: #3898d9;
}

.main .main-top .inner-title {
  color: #3898d9;
  text-align: center;
  font-size: 40px;
}

.main .main-middle {
  overflow-y: auto;
  max-height: calc(100vh - 120px);
  padding: 70px 80px 50px 80px;
}

.main .main-middle .inner-list {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 50px 20px;
}

.section-2 {
  background-color: var(--color-background);
  width: 90%;
  margin: 0 auto;
  padding: 40px;
  border-radius: 24px;
  /* overflow-y: auto;
  max-height: calc(100vh - 120px); */
}

.section-2 .inner-title {
  text-align: center;
  margin-top: 0;
  font-size: 26px;
  font-weight: 700;
  color: #fff;
  margin-bottom: 45px;
}

.section-2 .inner-form {
  display: flex;
  flex-direction: column;
  gap: 30px;
}

.section-2 .inner-group .inner-label {
  display: block;
  margin-bottom: 10px;
  font-size: 18px;
  font-weight: 700;
  color: #fff;
}

.section-2 .inner-group .inner-input {
  width: 100%;
  height: 40px;
  outline: none;
  border: var(--color-background);
  border-radius: 8px;
  padding: 20px 10px;
}

.section-2 .inner-meta-button {
  margin-top: 20px;
  display: inline-flex;
  align-items: center;
  gap: 20px;
  justify-content: flex-end;
}

.section-2 .inner-meta-button .inner-button {
  width: 80px;
  height: 35px;
  border-radius: 20px;
  border: 0;
  cursor: pointer;
  font-size: 16px;
  font-weight: 700;
}

.section-2 .inner-meta-button .inner-button:first-child {
  background-color: green;
  color: #fff;
}

.section-2 .inner-meta-button .inner-button:first-child:hover {
  background-color: rgb(10, 178, 10);
}

.section-2 .inner-meta-button .inner-button:last-child {
  background-color: gray;
}

.section-2 .inner-meta-button .inner-button:last-child a {
  color: #fff;
}

.section-2 .inner-meta-button .inner-button:last-child:hover {
  background-color: rgb(73, 73, 73);
}
</style>
<body>
  <nav class="side">
    <div class="inner-user">
      <div class="inner-image">
        <a href="#">
          <img src="./assets/image/myself.png" alt="">
        </a>
      </div>
      <h2 class="inner-name">
        Admin
     </h2>
    </div>
    <div class="inner-menu">
      <ul>
        <li class="active">
          <a href="#">
            Trang Chủ
          </a>
        </li>
        <li>
          <a href="#">
            Thêm Dữ Liệu
          </a>
        </li>
        <li>
          <a href="#">
            Đăng Xuất
          </a>
        </li>
      </ul>
    </div>
  </nav>
  <div class="main">
    <div class="main-top">
      <div class="inner-list-icon">
        <ul>
          <li><a href="#"><i class="fa-solid fa-bell"></i></a></li>
          <li><a href="#"><i class="fa-solid fa-right-from-bracket"></i></a></li>
        </ul>
      </div>
      <h1 class="inner-title">
        Danh Sách Lớp Học
      </h1>
    </div>
    <div class="main-middle">
      <div class="section-2">
        <h2 class="inner-title">Tạo Thông Tin Lớp</h2>
        <form action="" method= "" class="inner-form">
          <div class="inner-group">
            <label for="code" class="inner-label">Mã Lớp</label>
            <input type="text" name="" id="code" class="inner-input" placeholder="Nhập mã lớp">
          </div>
          <div class="inner-group">
            <label for="code" class="inner-label">Tên Lớp</label>
            <input type="text" name="" id="code" class="inner-input" placeholder="Nhập tên lớp">
          </div>
          <div class="inner-group">
            <label for="date-create" class="inner-label">Ngày Tạo</label>
            <input type="date" name="" id="date-create" class="inner-input" placeholder="Nhập ngày tạo">
          </div>
          <div class="inner-group">
            <label for="date-end" class="inner-label">Ngày Kết Thúc</label>
            <input type="date" name="" id="date-endend" class="inner-input" placeholder="Nhập ngày kết thúc">
          </div>
          <div class="inner-group">
            <label for="count" class="inner-label">Số Lượng Sinh Viên</label>
            <input type="number" name="" id="count" class="inner-input" placeholder="Nhập số lượng sinh viên">
          </div>
          <div class="inner-group">
            <label for="name-teach" class="inner-label">Giảng Viên</label>
            <input type="text" name="" id="name-teach" class="inner-input" placeholder="Nhập tên giảng viên">
          </div>
  
          <div class="inner-meta-button">
            <button class="inner-button">Tạo</button>
            <button class="inner-button"><a href="index.html">Hủy</a></button>
          </div>
  
        </form>
      </div>
    </div>
    </div>
  </div>
</body>
</html>
